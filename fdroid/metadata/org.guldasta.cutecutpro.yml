Name: CuteCut Pro
Summary: Professional multitrack video editor with Quranic audio-to-text synchronization
Description: |-
  CuteCut Pro is a powerful, offline-first multi-track video editing suite tailored for high-speed timeline editing, real-time FFmpeg processing, dynamic audio frequency waveforms, and dedicated Quranic recitation-to-text synchronization.

  Features:
  * Multi-layer video, audio, image, and text track editing
  * Real-time audio frequency waveforms with customizable visual styles
  * Complete 114 Quranic Surahs with Hafs Uthmanic v14 typography
  * Dual-language subtitle tracks with automatic verse synchronization
  * Offline-first indexed media engine

