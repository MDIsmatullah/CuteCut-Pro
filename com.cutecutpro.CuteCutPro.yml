app-id: com.cutecutpro.CuteCutPro
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: cutecut-pro
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --share=network
  - --socket=pulseaudio
  - --device=all
  - --filesystem=host
  - --env=ELECTRON_OZONE_PLATFORM_HINT=auto
modules:
  - name: cutecut-pro
    buildsystem: simple
    build-commands:
      - install -Dm755 cutecut-pro /app/bin/cutecut-pro
      - install -Dm644 icon.png /app/share/icons/hicolor/512x512/apps/com.cutecutpro.CuteCutPro.png
      - install -Dm644 com.cutecutpro.CuteCutPro.desktop /app/share/applications/com.cutecutpro.CuteCutPro.desktop
      - install -Dm644 com.cutecutpro.CuteCutPro.appdata.xml /app/share/metainfo/com.cutecutpro.CuteCutPro.appdata.xml
    sources:
      - type: file
        path: cutecut-pro
      - type: file
        path: icon.png
      - type: file
        path: com.cutecutpro.CuteCutPro.desktop
      - type: file
        path: com.cutecutpro.CuteCutPro.appdata.xml
