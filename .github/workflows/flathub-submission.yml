name: Submit Manifest to Flathub Submissions Queue

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Target Flathub submission repository'
        required: true
        default: 'flathub/flathub'

jobs:
  submit-flathub:
    name: Create Flathub Submission Pull Request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitHub CLI & Flatpak Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gh flatpak

      - name: Validate Flatpak Manifest Syntax
        run: |
          echo "Validating Flatpak manifest..."
          cat org.guldasta.cutecutpro.yaml
          cat org.guldasta.cutecutpro.metainfo.xml
          cat org.guldasta.cutecutpro.desktop

      - name: Run Flathub Submission & PR Creation
        run: |
          chmod +x scripts/submit-flathub-pr.sh
          WORKSPACE_ROOT="$GITHUB_WORKSPACE" ./scripts/submit-flathub-pr.sh
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

